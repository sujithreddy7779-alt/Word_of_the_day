<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Word a Day">
<title>Word of the Day</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,100..900,0..100;1,9..144,100..900,0..100&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one-screen phone app. Header, a stack of glass cards, a quiet control row.
     Card fronts read like a dictionary entry; card backs list the word in five tenses. */
  --bg:#000000;
  --text:#ffffff;
  --text-muted:rgba(255,255,255,.58);
  --chrome:rgba(255,255,255,.09);
  --chrome-line:rgba(255,255,255,.18);
  --focus:#ffffff;
  --font-display:"Fraunces", ui-serif, "New York", Georgia, serif;
  --font-body:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --radius-card:34px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}

/* Ambient light behind the glass, tinted by the current card */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;will-change:transform}
.orb.a{width:130vmin;height:130vmin;left:50%;top:48%;margin:-65vmin 0 0 -65vmin;animation:drift-a 16s ease-in-out infinite alternate}
.orb.b{width:96vmin;height:96vmin;right:-36vmin;bottom:-32vmin;animation:drift-b 21s ease-in-out infinite alternate}
.glow{
  position:absolute;inset:0;opacity:0;will-change:opacity;
  transition:opacity 1s ease;
  background:radial-gradient(closest-side, rgba(var(--c,0,0,0), .44), rgba(var(--c,0,0,0), .17) 50%, rgba(var(--c,0,0,0), 0) 100%);
}
.orb.b .glow{background:radial-gradient(closest-side, rgba(var(--c,0,0,0), .32), rgba(var(--c,0,0,0), .12) 50%, rgba(var(--c,0,0,0), 0) 100%)}
.glow.on{opacity:1}
@keyframes drift-a{from{transform:translate3d(-7%,-5%,0) scale(1)}to{transform:translate3d(6%,6%,0) scale(1.08)}}
@keyframes drift-b{from{transform:translate3d(0,0,0)}to{transform:translate3d(-14%,-10%,0)}}

.app{
  position:fixed;inset:0;z-index:1;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:18px;
  padding:
    calc(env(safe-area-inset-top) + 14px)
    max(20px, env(safe-area-inset-right))
    calc(env(safe-area-inset-bottom) + 14px)
    max(20px, env(safe-area-inset-left));
}

.top{display:flex;flex-direction:column;gap:2px;padding:0 4px}
.top h1{font-family:var(--font-display);font-variation-settings:"SOFT" 100;font-weight:600;font-size:26px;line-height:1.1;letter-spacing:-.01em}
.top p{font-size:15px;color:var(--text-muted)}

.deck-wrap{display:grid;place-items:center;min-height:0}
.deck{position:relative;width:min(100%, 400px);height:min(100%, 620px);perspective:1100px;touch-action:none}

/* Card = positioning shell (stack + swipe) > glass (tilt) > flipper (swipe up/down) > front and back faces */
.card{
  position:absolute;left:0;right:0;top:0;bottom:30px;
  perspective:900px;
  transform-origin:50% 50%;
  transition:transform .5s cubic-bezier(.2,.8,.2,1), opacity .35s ease;
  will-change:transform;
  contain:layout style;
  cursor:grab;
}
.card.dragging{cursor:grabbing}
.card[data-ink="dark"]{--ink:#000000;--ink-soft:rgba(0,0,0,.66);--chip:rgba(0,0,0,.11);--chip-line:rgba(0,0,0,.14);--rule:rgba(0,0,0,.14)}
.card[data-ink="light"]{--ink:#ffffff;--ink-soft:rgba(255,255,255,.8);--chip:rgba(255,255,255,.17);--chip-line:rgba(255,255,255,.24);--rule:rgba(255,255,255,.22)}

.glass{position:absolute;inset:0;perspective:1400px;transform:rotateX(0deg) rotateY(0deg);will-change:transform}
.flipper{position:absolute;inset:0;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;transform:rotateX(0deg)}
.face{
  position:absolute;inset:0;
  border-radius:var(--radius-card);
  overflow:hidden;
  color:var(--ink);
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  /* Glass tint over a dark backing, so cards behind never show through as outlines */
  background:
    linear-gradient(155deg, rgba(var(--rgb), .96) 0%, rgba(var(--rgb), .85) 52%, rgba(var(--rgb), .91) 100%),
    linear-gradient(rgba(0,0,0,.72), rgba(0,0,0,.72));
  border:1px solid rgba(255,255,255,.42);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.7),
    inset 1px 0 0 rgba(255,255,255,.18),
    inset 0 -1px 0 rgba(255,255,255,.22),
    inset 0 -60px 90px -40px rgba(0,0,0,.22),
    0 44px 90px -30px rgba(var(--rgb), .6),
    0 22px 44px -14px rgba(0,0,0,.85);
}
.face.front{transform:rotateX(0deg)}
.face.back{
  transform:rotateX(180deg);
  background:
    linear-gradient(25deg, rgba(var(--rgb), .96) 0%, rgba(var(--rgb), .86) 50%, rgba(var(--rgb), .92) 100%),
    linear-gradient(rgba(0,0,0,.72), rgba(0,0,0,.72));
}
.sheen{
  position:absolute;left:-40%;top:-60%;width:180%;height:180%;pointer-events:none;opacity:.55;
  background:radial-gradient(closest-side, rgba(255,255,255,.5), rgba(255,255,255,.2) 32%, rgba(255,255,255,0) 60%);
  will-change:transform;
}
.face::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(118deg, rgba(255,255,255,0) 34%, rgba(255,255,255,.055) 44%, rgba(255,255,255,0) 56%);
}
.card:not(.is-top) .face{border-color:transparent;box-shadow:none}
.card:not(.is-top) .sheen{opacity:0}
/* The five-tense side is only drawn while it's in use */
.face.back{visibility:hidden}
.card.back-on .face.back{visibility:visible}

.content{
  position:relative;z-index:1;height:100%;
  display:flex;flex-direction:column;
  padding:24px 26px 22px;
  transition:opacity .3s ease;
}
.card:not(.is-top) .content{opacity:0}

/* Front */
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px}
.kind{
  font-size:14px;font-weight:600;letter-spacing:.01em;
  padding:6px 12px;border-radius:999px;
  background:var(--chip);border:1px solid var(--chip-line);
}
.pos{font-family:var(--font-display);font-style:italic;font-size:17px;font-variation-settings:"SOFT" 100;color:var(--ink-soft);white-space:nowrap}
.head{margin-top:auto;padding-top:18px}
.word{
  font-family:var(--font-display);font-variation-settings:"SOFT" 100;font-weight:650;
  font-size:56px;line-height:1.02;letter-spacing:-.025em;
  white-space:nowrap;text-wrap:balance;overflow:hidden;padding-bottom:.06em;
}
.say{margin-top:8px;font-size:16px;letter-spacing:.03em;color:var(--ink-soft);font-weight:500}
.meaning{margin-top:clamp(16px, 3.6vh, 30px);font-size:clamp(19px, 5.4vw, 23px);line-height:1.36;font-weight:500;letter-spacing:-.005em;text-wrap:pretty}
.example{
  margin-top:auto;padding-top:16px;
  font-family:var(--font-display);font-style:italic;font-variation-settings:"SOFT" 100;
  font-size:17px;line-height:1.42;color:var(--ink-soft);text-wrap:pretty;
}

/* Flip cue on both faces */
.cue{
  align-self:center;margin-top:14px;flex:none;
  display:inline-flex;align-items:center;gap:6px;
  font:600 13.5px/1 var(--font-body);color:var(--ink);
  padding:8px 14px 8px 10px;border-radius:999px;
  background:var(--chip);border:1px solid var(--chip-line);
  -webkit-appearance:none;appearance:none;cursor:pointer;touch-action:manipulation;
}
.cue svg{width:16px;height:16px}
.cue:active{transform:scale(.96)}
.cue:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* Back: five tenses */
.back-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.back-word{
  min-width:0;
  font-family:var(--font-display);font-variation-settings:"SOFT" 100;font-weight:650;
  font-size:32px;line-height:1.05;letter-spacing:-.02em;white-space:nowrap;text-wrap:balance;overflow:hidden;
}
.tenses{list-style:none;margin-top:10px}
.tenses li{padding:calc(var(--sent,17px) * .55) 0;border-top:1px solid var(--rule)}
.tenses li:first-child{border-top:0}
.tense{display:block;font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--ink-soft);margin-bottom:3px}
.sent{font-size:var(--sent,17px);line-height:1.32;text-wrap:pretty}
.sent strong{
  font-weight:700;background:var(--chip);border-radius:5px;padding:0 .18em;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
}
.back .cue{margin-top:auto}

/* Controls */
.controls{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:12px}
.btn{
  width:52px;height:52px;border-radius:50%;
  display:grid;place-items:center;color:var(--text);
  background:var(--chrome);border:1px solid var(--chrome-line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22);
  cursor:pointer;touch-action:manipulation;
  transition:transform .15s ease, opacity .2s ease, background-color .2s ease;
}
.btn:active{transform:scale(.92);background:rgba(255,255,255,.16)}
.btn:disabled{opacity:.3;cursor:default}
.btn:disabled:active{transform:none}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.btn svg{width:22px;height:22px}
.btn.hidden{visibility:hidden}
.hint{text-align:center;font-size:14px;line-height:1.3;color:var(--text-muted);text-wrap:balance}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion: reduce){
  .orb{animation:none}
  .card{transition:transform .2s ease, opacity .2s ease}
}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true">
  <div class="orb a" id="orbA"><div class="glow"></div><div class="glow"></div></div>
  <div class="orb b" id="orbB"><div class="glow"></div><div class="glow"></div></div>
</div>

<div class="app">
  <header class="top">
    <h1>Word of the day</h1>
    <p id="todayLabel"></p>
  </header>

  <main class="deck-wrap">
    <div class="deck" id="deck" role="region" aria-label="Word cards"></div>
  </main>

  <nav class="controls" aria-label="Card controls">
    <button class="btn" id="backBtn" type="button" aria-label="Bring back the last word" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <p class="hint" id="hint">Swipe left or right for the next word</p>
    <button class="btn" id="sayBtn" type="button" aria-label="Hear the word">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
    </button>
  </nav>
</div>

<p class="sr-only" id="live" aria-live="polite"></p>

<script src="words.js"></script>
<script>
(function(){
  "use strict";

  // Words come from words.js: [group, word, pronunciation, type, meaning, example, [5 sentences]]
  const TENSES = ["Present", "Past", "Future", "Present continuous", "Present perfect"];
  const DATA = Array.isArray(window.WOTD_WORDS) ? window.WOTD_WORDS : [];
  const HARD = [], EASY = [], TALK = [];
  const SENTENCES = {};
  DATA.forEach(r => {
    if (!Array.isArray(r) || r.length < 7) return;
    SENTENCES[r[1]] = r[6];
    (r[0] === "e" ? EASY : r[0] === "t" ? TALK : HARD).push([r[1], r[2], r[3], r[4], r[5]]);
  });
  if (!DATA.length){
    document.getElementById("hint").textContent = "The word list didn't load. Refresh the page to try again.";
    return;
  }

  // A fresh random order every time the page opens, with hard words, easy words and phrases evenly mixed
  function shuffle(a){
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function mixDeck(lists){
    return lists
      .filter(list => list.length)
      .map(shuffle)
      .flatMap(list => { const phase = Math.random(); return list.map((w, i) => ({ w, k: (i + phase) / list.length })); })
      .sort((a, b) => a.k - b.k)
      .map(x => x.w);
  }

  // The deck keeps growing as you swipe, so it never runs out
  const WORDS = mixDeck([HARD, EASY, TALK]);
  function ensureAhead(upTo){
    while (WORDS.length < upTo + 12){
      const recent = new Set(WORDS.slice(-24).map(w => w[0]));
      WORDS.push.apply(WORDS, mixDeck([HARD, EASY, TALK]).filter(w => !recent.has(w[0])));
    }
  }

  // Start on a word this browser hasn't opened on recently
  (function avoidRepeats(){
    let recent = [];
    try { recent = JSON.parse(localStorage.getItem("wotd-recent") || "[]"); } catch (_) {}
    if (!Array.isArray(recent)) recent = [];
    const i = WORDS.findIndex(w => recent.indexOf(w[0]) === -1);
    if (i > 0) WORDS.push.apply(WORDS, WORDS.splice(0, i));
    recent.unshift(WORDS[0][0]);
    try { localStorage.setItem("wotd-recent", JSON.stringify(recent.slice(0, 60))); } catch (_) {}
  })();

  // Alternates light and deep colors so the text flips between black and white
  const PALETTE = ["#FFD23F","#6C4CFF","#4FF0B9","#E0245E","#6FD6FF","#0E9F6E","#FF9ECD","#2546F0","#B8F35A","#B5179E","#CDB4FF","#E85D04"];

  const deck = document.getElementById("deck");
  const backBtn = document.getElementById("backBtn");
  const sayBtn = document.getElementById("sayBtn");
  const hint = document.getElementById("hint");
  const live = document.getElementById("live");
  const orbA = document.getElementById("orbA");
  const orbB = document.getElementById("orbB");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const fineHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

  const mod = (n, m) => ((n % m) + m) % m;
  const hexToRgb = h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function relLum(rgb){
    const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    return 0.2126 * f(rgb[0]) + 0.7152 * f(rgb[1]) + 0.0722 * f(rgb[2]);
  }
  // Pick black or white text from the card's real on-screen color (glass tint over a black backdrop)
  function inkFor(rgb){
    const L = relLum(rgb.map(v => v * 0.86));
    return (L + 0.05) / 0.05 >= 1.05 / (L + 0.05) ? "dark" : "light";
  }

  const colorStart = Math.floor(Math.random() * PALETTE.length);
  function entryFor(offset){
    ensureAhead(offset);
    return { offset, w: WORDS[offset], color: PALETTE[mod(colorStart + offset, PALETTE.length)] };
  }

  function el(tag, cls, text){
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  const ICON_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>';
  const ICON_DOWN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';

  function cueButton(dir, label){
    const b = el("button", "cue");
    b.type = "button";
    b.dataset.flip = dir;
    b.innerHTML = dir === "up" ? ICON_UP : ICON_DOWN;
    b.appendChild(el("span", null, label));
    return b;
  }

  // Turn "*word*" markers into highlighted text
  function sentenceNode(text){
    const p = el("p", "sent");
    text.split(/(\*[^*]+\*)/).forEach(part => {
      if (!part) return;
      if (part.length > 2 && part.charAt(0) === "*" && part.charAt(part.length - 1) === "*") p.appendChild(el("strong", null, part.slice(1, -1)));
      else p.appendChild(document.createTextNode(part));
    });
    return p;
  }

  function makeCard(offset){
    const e = entryFor(offset);
    const [word, say, pos, meaning, example] = e.w;
    const rgb = hexToRgb(e.color);

    const card = el("article", "card");
    card._flip = 0;
    card.dataset.color = e.color;
    card.dataset.ink = inkFor(rgb);
    card.style.setProperty("--rgb", rgb.join(","));

    const glass = el("div", "glass");
    const flipper = el("div", "flipper");

    // Front: the word and its meaning
    const front = el("section", "face front");
    front.appendChild(el("div", "sheen"));
    const fc = el("div", "content");
    const meta = el("div", "meta");
    meta.appendChild(el("span", "kind", pos));
    const head = el("div", "head");
    head.appendChild(el("h2", "word", word));
    if (say) head.appendChild(el("p", "say", say));
    fc.append(meta, head, el("p", "meaning", meaning), el("p", "example", example), cueButton("up", "Swipe up for 5 sentences"));
    front.appendChild(fc);

    // Back: the word in five tenses
    const back = el("section", "face back");
    back.appendChild(el("div", "sheen"));
    const bc = el("div", "content");
    const bh = el("div", "back-head");
    bh.append(el("h3", "back-word", word), el("span", "pos", "in 5 tenses"));
    const list = el("ol", "tenses");
    (SENTENCES[word] || []).forEach((s, i) => {
      const li = el("li");
      li.append(el("span", "tense", TENSES[i]), sentenceNode(s));
      list.appendChild(li);
    });
    bc.append(bh, list, cueButton("down", "Swipe down to go back"));
    back.appendChild(bc);
    back.inert = true;
    back.setAttribute("aria-hidden", "true");

    flipper.append(front, back);
    glass.appendChild(flipper);
    card.appendChild(glass);
    card._glass = glass;
    card._flipper = flipper;
    card._front = front;
    card._back = back;
    card._sheens = [front.firstChild, back.firstChild];
    return card;
  }

  // ---- Make every card's text fit without clipping
  function fitWord(card){
    const h = card.querySelector(".word");
    const over = () => h.scrollWidth > h.clientWidth + 1;
    let size = 56;
    h.style.whiteSpace = "nowrap";
    h.style.fontSize = size + "px";
    const floor = h.textContent.indexOf(" ") > -1 ? 38 : 26;
    while (over() && size > floor){ size -= 2; h.style.fontSize = size + "px"; }
    if (over() && floor === 38){
      h.style.whiteSpace = "normal";
      size = 48;
      h.style.fontSize = size + "px";
      while (over() && size > 26){ size -= 2; h.style.fontSize = size + "px"; }
    }
  }

  function fitCard(card){
    fitWord(card);

    const bw = card.querySelector(".back-word");
    const bwOver = () => bw.scrollWidth > bw.clientWidth + 1;
    let b = 32;
    bw.style.whiteSpace = "nowrap";
    bw.style.fontSize = b + "px";
    while (bwOver() && b > 22){ b -= 1; bw.style.fontSize = b + "px"; }
    if (bwOver() && bw.textContent.indexOf(" ") > -1){
      bw.style.whiteSpace = "normal";
      b = 28;
      bw.style.fontSize = b + "px";
    }
    while (bwOver() && b > 16){ b -= 1; bw.style.fontSize = b + "px"; }

    const fc = card.querySelector(".front .content");
    const meaning = fc.querySelector(".meaning");
    const example = fc.querySelector(".example");
    meaning.style.fontSize = "";
    example.style.display = "";
    const fOver = () => fc.scrollHeight > fc.clientHeight + 1;
    if (fOver()){
      let m = parseFloat(getComputedStyle(meaning).fontSize);
      while (fOver() && m > 15){ m -= 1; meaning.style.fontSize = m + "px"; }
      if (fOver()) example.style.display = "none";
    }

    const bc = card.querySelector(".back .content");
    let s = 17;
    bc.style.setProperty("--sent", s + "px");
    while (bc.scrollHeight > bc.clientHeight + 1 && s > 12){ s -= 0.5; bc.style.setProperty("--sent", s + "px"); }
  }

  // ---- Stack layout
  // Everything that moves is moved with transform/opacity only, and sizes are measured once,
  // so the browser never has to redo layout in the middle of a swipe.
  let pos = 0;          // how far into this session's deck the top card is
  let cards = [];       // index 0 is the top card
  const DEPTHS = 4;     // 3 visible + 1 waiting behind
  let cardW = 340, cardH = 520;

  function measure(){
    const c = cards[0];
    if (c){ cardW = c.offsetWidth || cardW; cardH = c.offsetHeight || cardH; }
  }

  function depthTransform(d){
    const s = 1 - 0.055 * d;
    const y = (cardH / 2) * (1 - s) + 13 * d;
    return "translate3d(0," + y.toFixed(2) + "px,0) scale(" + s.toFixed(4) + ")";
  }
  function depthOpacity(d){
    if (d <= 1) return 1;
    if (d <= 2) return 1 - (d - 1) * 0.35;
    return Math.max(0, 0.65 - (d - 2) * 0.65);
  }

  // Which card is on top (only touched when the stack changes, never during a drag)
  function assignRoles(){
    cards.forEach((c, i) => {
      c.style.zIndex = String(100 - i);
      const top = i === 0;
      if (c._role !== top){
        c._role = top;
        c.classList.toggle("is-top", top);
        c.inert = !top;
        c.setAttribute("aria-hidden", top ? "false" : "true");
      }
    });
  }

  function placeStack(animate){
    cards.forEach((c, i) => {
      if (i === 0 && drag) return;
      c.style.transition = animate ? "" : "none";
      c.style.transform = depthTransform(i);
      c.style.opacity = String(depthOpacity(i));
    });
  }

  // While dragging, the cards behind slide up a little to follow your finger
  function placeBehind(progress){
    for (let i = 1; i < cards.length; i++){
      const d = i - progress;
      cards[i].style.transform = depthTransform(d);
      cards[i].style.opacity = String(depthOpacity(d));
    }
  }

  function layout(animate){ assignRoles(); placeStack(animate); }

  const isFlipped = () => !!(cards[0] && cards[0]._flip === 180);

  function updateHint(){
    if (isFlipped()) hint.textContent = fineHover ? "Drag down or press ↓ to go back" : "Swipe down to go back to the word";
    else hint.textContent = fineHover ? "Drag the card or press ← → for the next word" : "Swipe left or right for the next word";
  }

  // Background glow: fade between two pre-drawn layers instead of repainting
  function setGlow(orb, hex){
    if (!orb || !hex || orb._hex === hex) return;
    orb._hex = hex;
    const a = orb.children[0], b = orb.children[1];
    const next = a.classList.contains("on") ? b : a;
    const prev = next === a ? b : a;
    next.style.setProperty("--c", hexToRgb(hex).join(","));
    next.classList.add("on");
    prev.classList.remove("on");
  }
  let glowTimer = 0;
  function syncGlow(){
    if (cards[0]) setGlow(orbA, cards[0].dataset.color);
    if (cards[1]) setGlow(orbB, cards[1].dataset.color);
  }

  function syncChrome(deferGlow){
    backBtn.disabled = pos === 0;
    if (cards[0]){
      const w = entryFor(pos).w;
      live.textContent = w[0] + ", " + w[2] + ". " + w[3];
    }
    updateHint();
    clearTimeout(glowTimer);
    if (deferGlow) glowTimer = setTimeout(syncGlow, 160);
    else syncGlow();
  }

  // ---- Flip to the five-tense side and back
  function setFlip(card, angle, animate, ms){
    card._flip = angle;
    const showBack = angle === 180;
    const f = card._flipper;
    const dur = reduceMotion.matches ? 250 : (ms || 650);
    if (showBack) card.classList.add("back-on");
    f.style.transition = animate ? "transform " + dur + "ms cubic-bezier(.2,.85,.25,1.04)" : "none";
    f.style.transform = "rotateX(" + angle + "deg)";
    card._front.inert = showBack;
    card._back.inert = !showBack;
    card._front.setAttribute("aria-hidden", String(showBack));
    card._back.setAttribute("aria-hidden", String(!showBack));
    clearTimeout(card._backTimer);
    if (!showBack){
      card._backTimer = setTimeout(() => { if (!card._flip) card.classList.remove("back-on"); }, animate ? dur + 60 : 0);
    }
    if (card === cards[0]){
      updateHint();
      if (animate){
        const w = entryFor(pos).w[0];
        live.textContent = showBack ? "Five sentences using " + w : w;
      }
    }
  }

  // ---- Building cards (done ahead of time, never in the middle of an animation)
  function newCard(offset){
    const c = makeCard(offset);
    c.style.transition = "none";
    c.style.opacity = "0";
    c.style.transform = depthTransform(DEPTHS);
    deck.appendChild(c);
    fitCard(c);
    return c;
  }

  function build(){
    deck.textContent = "";
    cards = [];
    for (let i = 0; i < DEPTHS; i++) cards.push(newCard(pos + i));
    measure();
    layout(false);
    syncChrome(false);
  }

  let refillTimer = 0;
  function refill(){
    refillTimer = 0;
    if (drag){ refillTimer = setTimeout(refill, 120); return; }
    let added = false;
    while (cards.length < DEPTHS){ cards.push(newCard(pos + cards.length)); added = true; }
    if (added) layout(true);
  }
  function scheduleRefill(ms){
    if (!refillTimer) refillTimer = setTimeout(refill, ms);
  }

  // ---- Swipe the top card away (either direction shows the next word)
  // The card keeps the speed your finger had when you let go.
  function dismiss(dir, o){
    o = o || {};
    const top = cards[0];
    if (!top || top._flip) return;
    const W = window.innerWidth;
    const fromX = o.dx || 0;
    const endX = dir * (W + cardW * 0.6 + 80);
    const dist = Math.abs(endX - fromX);
    const v = Math.abs(o.vx || 0);
    // This curve starts at 3x its average speed, so 3 * distance / speed matches the finger
    let T = v > 0.15 ? (3 * dist) / v : 420;
    T = Math.round(clamp(T, 220, 460));
    if (reduceMotion.matches) T = 200;
    const fromY = (o.dy || 0) * 0.3;
    const endY = fromY + clamp((o.vy || 0) * T * 0.3, -180, 180);

    top._role = null;
    top.classList.remove("dragging");
    top.classList.add("leaving");
    top.inert = true;
    top.setAttribute("aria-hidden", "true");
    top.style.zIndex = "300";
    top.style.transition = "transform " + T + "ms cubic-bezier(.25,.75,.5,1)";
    top.style.transform = "translate3d(" + endX.toFixed(1) + "px," + endY.toFixed(1) + "px,0) rotate(" + (dir * 24) + "deg) rotateY(" + (dir * 30) + "deg)";

    cards.shift();
    pos += 1;
    if (cards.length < 2) refill();
    layout(true);
    syncChrome(true);
    setTimeout(() => top.remove(), T + 80);
    scheduleRefill(Math.max(T, 500) + 60);
  }

  // ---- Bring the previous card back
  function rewind(){
    if (pos === 0 || drag) return;
    if (cards[0] && cards[0]._flip) setFlip(cards[0], 0, false);
    pos -= 1;
    const c = makeCard(pos);
    const W = window.innerWidth;
    c.style.transition = "none";
    c.style.zIndex = "300";
    c.style.transform = "translate3d(" + (-(W + cardW * 0.6 + 80)) + "px,0,0) rotate(-24deg) rotateY(-30deg)";
    deck.appendChild(c);
    fitCard(c);
    cards.unshift(c);
    void c.offsetWidth;
    while (cards.length > DEPTHS){ cards.pop().remove(); }
    layout(true);
    syncChrome(true);
  }

  // ---- Gestures: left/right for the next word, up/down to flip
  // Pointer events only record where the finger is; the screen is updated once per frame.
  let drag = null, dragFrame = 0;

  function dragTransform(dx, dy){
    const rz = clamp(dx * 0.055, -18, 18);
    const ry = clamp(dx * 0.07, -26, 26);
    return "translate3d(" + dx.toFixed(1) + "px," + (dy * 0.3).toFixed(1) + "px,0) rotate(" + rz.toFixed(2) + "deg) rotateY(" + ry.toFixed(2) + "deg)";
  }

  function flipAngle(d){
    let a = d.startFlip - (d.dy / (cardH * 0.75)) * 180;
    if (a < 0) a = -Math.min(12, -a * 0.25);
    else if (a > 180) a = 180 + Math.min(12, (a - 180) * 0.25);
    return a;
  }

  function renderDrag(){
    dragFrame = 0;
    const d = drag;
    if (!d) return;
    if (d.axis === "x"){
      d.card.style.transform = dragTransform(d.dx, d.dy);
      placeBehind(clamp(Math.abs(d.dx) / (cardW * 0.9), 0, 1) * 0.6);
    } else if (d.axis === "y"){
      d.card._flipper.style.transform = "rotateX(" + d.angle.toFixed(2) + "deg)";
    }
  }

  function velocity(d){
    const now = performance.now();
    const pts = d.hist.filter(p => now - p.t < 100);
    if (pts.length < 2) return { vx: 0, vy: 0 };
    const a = pts[0], b = pts[pts.length - 1];
    const dt = Math.max(8, b.t - a.t);
    return { vx: (b.x - a.x) / dt, vy: (b.y - a.y) / dt };
  }

  deck.addEventListener("pointerdown", e => {
    const top = cards[0];
    if (!top || e.button > 0 || drag) return;
    if (e.target.closest("button")) return;
    if (e.target.closest(".card") !== top) return;
    const rect = top.getBoundingClientRect();
    drag = {
      id: e.pointerId, card: top, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, axis: null,
      startFlip: top._flip || 0, angle: top._flip || 0,
      hist: [{ x: e.clientX, y: e.clientY, t: performance.now() }]
    };
    try { top.setPointerCapture(e.pointerId); } catch (_) {}
    top.classList.add("dragging");
    pointerTilt = tiltFromPoint(
      clamp((e.clientX - rect.left) / rect.width, 0, 1),
      clamp((e.clientY - rect.top) / rect.height, 0, 1), 1.2);
  });

  deck.addEventListener("pointermove", e => {
    if (drag && e.pointerId === drag.id){
      const d = drag;
      d.dx = e.clientX - d.x0;
      d.dy = e.clientY - d.y0;
      const t = performance.now();
      d.hist.push({ x: e.clientX, y: e.clientY, t });
      if (d.hist.length > 12) d.hist.shift();

      if (!d.axis){
        if (Math.abs(d.dx) < 6 && Math.abs(d.dy) < 6) return;
        // Vertical drags flip the card; sideways drags only work on the word side
        d.axis = Math.abs(d.dy) > Math.abs(d.dx) ? "y" : (d.startFlip ? "none" : "x");
        if (d.axis === "x"){
          d.card.style.transition = "none";
          for (let i = 1; i < cards.length; i++) cards[i].style.transition = "none";
        } else if (d.axis === "y"){
          d.card.classList.add("back-on");
          clearTimeout(d.card._backTimer);
          d.card._flipper.style.transition = "none";
        }
      }
      if (d.axis === "y") d.angle = flipAngle(d);
      if (d.axis && !dragFrame) dragFrame = requestAnimationFrame(renderDrag);
      return;
    }
    // Mouse hover tilt on computers
    if (e.pointerType === "mouse" && cards[0]){
      const r = cards[0].getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      pointerTilt = (px >= 0 && px <= 1 && py >= 0 && py <= 1) ? tiltFromPoint(px, py, 1) : null;
    }
  });

  function endDrag(e, cancelled){
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    pointerTilt = null;
    if (dragFrame){ cancelAnimationFrame(dragFrame); dragFrame = 0; }
    d.card.classList.remove("dragging");
    const { vx, vy } = velocity(d);

    if (d.axis === "x" && !cancelled){
      const far = Math.abs(d.dx) > cardW * 0.3;
      const flick = Math.abs(vx) > 0.4 && Math.abs(d.dx) > 20 && Math.sign(vx) === Math.sign(d.dx);
      if (far || flick){
        dismiss(Math.sign(d.dx) || 1, { dx: d.dx, dy: d.dy, vx, vy });
        return;
      }
    }
    if (d.axis === "y"){
      let target = d.startFlip;
      if (!cancelled){
        if (d.startFlip === 0) target = (d.angle > 70 || (vy < -0.3 && d.dy < -16)) ? 180 : 0;
        else target = (d.angle < 110 || (vy > 0.3 && d.dy > 16)) ? 0 : 180;
      }
      // Finish the flip at the speed of the swipe
      const w = Math.abs(vy) / (cardH * 0.75) * 180;          // degrees per ms
      const left = Math.abs(target - d.angle);
      const ms = w > 0.05 ? clamp((2.5 * left) / w, 260, 650) : 600;
      setFlip(d.card, target, true, Math.round(ms));
    }
    // Spring back into place
    d.card.style.transition = reduceMotion.matches ? "transform .2s ease" : "transform .55s cubic-bezier(.2,1.25,.35,1)";
    d.card.style.transform = depthTransform(0);
    placeStack(true);
  }
  deck.addEventListener("pointerup", e => endDrag(e, false));
  deck.addEventListener("pointercancel", e => endDrag(e, true));
  deck.addEventListener("lostpointercapture", e => endDrag(e, false));
  deck.addEventListener("pointerleave", e => { if (!drag && e.pointerType === "mouse") pointerTilt = null; });

  // Tap the cue buttons to flip
  deck.addEventListener("click", e => {
    const b = e.target.closest(".cue");
    if (!b) return;
    const card = b.closest(".card");
    if (card !== cards[0]) return;
    setFlip(card, b.dataset.flip === "up" ? 180 : 0, true);
  });

  // ---- 3D tilt + moving light on the top card (transform-only, so nothing is redrawn)
  let pointerTilt = null;
  const tilt = { rx: 0, ry: 0, mx: 45, my: 8 };
  const REST = { rx: 0, ry: 0, mx: 30, my: 6 };

  function tiltFromPoint(px, py, strength){
    return { rx: -(py - 0.5) * 14 * strength, ry: (px - 0.5) * 16 * strength, mx: px * 100, my: py * 100 };
  }

  function frame(t){
    const top = cards[0];
    if (top && top._glass){
      const target = pointerTilt || (reduceMotion.matches ? REST : {
        rx: Math.sin(t / 2300) * 3.2,
        ry: Math.cos(t / 3100) * 4.4,
        mx: 45 + Math.cos(t / 3100) * 32,
        my: 8 + Math.sin(t / 2300) * 14
      });
      const k = pointerTilt ? 0.22 : 0.06;
      tilt.rx += (target.rx - tilt.rx) * k;
      tilt.ry += (target.ry - tilt.ry) * k;
      tilt.mx += (target.mx - tilt.mx) * k;
      tilt.my += (target.my - tilt.my) * k;
      top._glass.style.transform = "rotateX(" + tilt.rx.toFixed(2) + "deg) rotateY(" + tilt.ry.toFixed(2) + "deg)";
      // The highlight is 180% of the card, so moving it 1% of its size moves the light 1.8% of the card
      const sheen = "translate3d(" + ((tilt.mx - 50) / 1.8).toFixed(2) + "%," + ((tilt.my - 30) / 1.8).toFixed(2) + "%,0)";
      top._sheens[0].style.transform = sheen;
      top._sheens[1].style.transform = sheen;
    }
    requestAnimationFrame(frame);
  }

  // ---- Buttons and keys
  backBtn.addEventListener("click", rewind);

  if ("speechSynthesis" in window && "SpeechSynthesisUtterance" in window){
    sayBtn.addEventListener("click", () => {
      try {
        const u = new SpeechSynthesisUtterance(entryFor(pos).w[0]);
        u.lang = "en-US";
        u.rate = 0.9;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
      } catch (_) {}
    });
  } else {
    sayBtn.classList.add("hidden");
  }

  document.addEventListener("keydown", e => {
    const top = cards[0];
    if (!top) return;
    if (e.key === "ArrowUp"){ e.preventDefault(); if (!top._flip) setFlip(top, 180, true); }
    else if (e.key === "ArrowDown"){ e.preventDefault(); if (top._flip) setFlip(top, 0, true); }
    else if (e.key === "ArrowRight"){ e.preventDefault(); dismiss(1); }
    else if (e.key === "ArrowLeft"){ e.preventDefault(); dismiss(-1); }
    else if (e.key === "Backspace"){ e.preventDefault(); rewind(); }
  });

  // Block pinch-zoom on iOS so swipes stay smooth
  document.addEventListener("gesturestart", e => e.preventDefault());

  window.addEventListener("resize", () => { cards.forEach(fitCard); measure(); layout(false); });

  document.getElementById("todayLabel").textContent =
    new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

  build();
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(() => { cards.forEach(fitCard); });
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
